# nginx.example.conf: FeatherAuth behind nginx. Goes in /etc/nginx/conf.d/ (or
# a file included from the http block). Replace auth.example.com with the host
# name of public_url.
#
# Certificate: Let's Encrypt with Certbot, for example
#   certbot certonly --webroot -w /var/www -d auth.example.com --deploy-hook "nginx -s reload"
# or a paid certificate (point ssl_certificate and ssl_certificate_key at your
# files and reload nginx after replacing them).
#
# Upstream: 127.0.0.1:8080 is the port compose.yaml publishes on the host.
# Put the Docker network's gateway range in trusted_proxies in server.yaml (the
# proxy reaches the container from the gateway address, not 127.0.0.1).
#
# The error log cannot be given a format, and it records the full request line
# (with the query string) and the upstream URL when the upstream fails, for
# example while FeatherAuth restarts. So each server block below sends its
# error log to its own file at level crit, which leaves those lines out.
#
# HTTP/2 is switched on with the listen parameter, not with the separate http2
# directive: that one exists only from nginx 1.25.1, and Ubuntu 24.04 ships
# 1.24. From 1.25.1 on, nginx -t only warns that the parameter is deprecated.
#
# nginx cannot hold requests while FeatherAuth restarts: it answers 502 during
# the gap, so keep restarts rare.

# Records $uri (the path), never $request or $request_uri: codes, state and
# id_token_hint travel in query strings and must not reach the access log.
# $http_referer is left out for the same reason.
log_format featherauth '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;
    access_log /var/log/nginx/featherauth.access.log featherauth;
    error_log /var/log/nginx/featherauth.error.log crit;

    # Certbot's webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.example.com;
    access_log /var/log/nginx/featherauth.access.log featherauth;
    error_log /var/log/nginx/featherauth.error.log crit;

    ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
