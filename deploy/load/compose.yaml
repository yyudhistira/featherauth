# Load verification stack (docs/DESIGN.md, Load verification): the real
# FeatherAuth image limited to 1 CPU and 512 MB, SQLite on a volume, Caddy and
# nginx in front (the proxy examples, derived by deploy/load_test.go) and the k6
# runner. The mock identity provider runs on the host (test support code) and
# the containers reach it as host.docker.internal.
#
# The Postgres variant (make load LOAD_DRIVER=postgres)
# starts the postgres service too, through the --profile postgres flag that the
# Go test passes. Postgres runs in its own container, measured apart from the service, and
# has no resource limit of its own: the limits above are the service's.
#
# Variables, all set by the Go test (build tag load, make load):
# LOAD_CONFIG (FeatherAuth's configuration), LOAD_PROXY (Caddyfile, nginx.conf
# and certs/), LOAD_OUT (k6 input and output).
name: featherauth-load
networks:
  default:
    ipam:
      config:
        # Fixed, so that trusted_proxies in server.yaml can name it.
        - subnet: 172.28.77.0/24
services:
  featherauth:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: featherauth-load:latest
    cpus: 1
    mem_limit: 512m
    environment:
      FEATHERAUTH_CONFIG_DIR: /etc/featherauth
      # Tuning knobs of the load verification: unset unless the host sets them.
      GOMEMLIMIT:
      GOGC:
      GODEBUG: ${LOAD_GODEBUG:-}
    volumes:
      - ${LOAD_CONFIG:?}:/etc/featherauth:ro
      - data:/var/lib/featherauth
    depends_on:
      postgres:
        condition: service_healthy
        required: false # absent unless the postgres profile is on
    extra_hosts:
      - "host.docker.internal:host-gateway"
  postgres:
    # Pinned by version and digest, the same image as compose.postgres.yaml.
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    profiles: [postgres]
    environment:
      POSTGRES_USER: featherauth
      POSTGRES_DB: featherauth
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      # Over TCP, as compose.postgres.yaml does: the first start answers on its
      # socket alone while it initializes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U featherauth -d featherauth"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${LOAD_CONFIG:?}/secrets/postgres_password:/run/secrets/postgres_password:ro
  caddy:
    # Same image as compose.caddy.yaml.
    image: caddy:2.11.9@sha256:9c1b76fb701c1f77383d3124d9f626e38bcf83bc1255ed47475d4f2420701d03
    depends_on:
      featherauth:
        condition: service_healthy
    ports:
      - "127.0.0.1:18543:443"
    volumes:
      - ${LOAD_PROXY:?}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LOAD_PROXY:?}/certs:/certs:ro
    networks:
      default:
        aliases:
          - auth.example.com
  nginx:
    # Same image as deploy/ops/check-proxy.sh.
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      featherauth:
        condition: service_healthy
    ports:
      - "127.0.0.1:18544:443"
    volumes:
      - ${LOAD_PROXY:?}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LOAD_PROXY:?}/certs:/etc/letsencrypt/live/auth.example.com:ro
  k6:
    # Pinned by version and digest; update both together.
    image: grafana/k6:1.4.2@sha256:3656673de3f30424e8ebcfa46acd9558d83b6a43612d0f668ffeac953950c6c7
    profiles: [run]
    depends_on:
      - caddy
      - nginx
    environment:
      BASE: ${LOAD_BASE:-https://auth.example.com}
      SCENARIO: ${LOAD_SCENARIO:-steady}
      DURATION: ${LOAD_DURATION:-10m}
      RATE: ${LOAD_RATE:-20}
      VUS: ${LOAD_VUS:-1000}
      SPREAD: ${LOAD_SPREAD:-0}
      NAME: ${LOAD_NAME:-run}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./k6.js:/k6.js:ro
      - ${LOAD_OUT:?}:/data
    entrypoint: ["k6", "run", "--quiet", "/k6.js"]
volumes:
  data:
  postgres-data:
