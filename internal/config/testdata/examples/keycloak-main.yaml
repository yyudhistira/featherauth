name: main
display_name: Example app            # Keycloak display name (plain text; the HTML variant is dropped).

tokens:
  access_token_lifetime: 15m            # parity (Keycloak 900 s)
  refresh_idle_lifetime: 30m            # parity (SSO idle 30 min). 720h is a one-line change if users should stay signed in longer.
  session_max_lifetime: 10h             # parity (SSO max 10 h)
  code_lifetime: 60s                    # parity (accessCodeLifespan 60 s)
  login_timeout: 30m                    # parity (accessCodeLifespanLogin 1800 s)
  # refresh_token_rotation: not set. Keycloak does not rotate, but app is a public client and always rotates
  # (DESIGN.md SEC-06); the app stores whatever it receives, so this is safe.
  algorithm: RS256                      # parity (also the default)
  refresh_token_format: jwt             # the app's library jwt-decodes the refresh token (default is opaque)

keys:
  - kid: main-2026-11                     # A new key from `featherauth keys generate`; the Keycloak key is not reused (see Signing key below).
    file: secrets/main/signing-2026-11.pem
    state: active

# user_data: the DESIGN.md defaults are enough (claims [name, email, email_verified, preferred_username]).
# See "Claims in tokens for this app" above.

providers:
  google:
    enabled: true
    client_id: <existing Google client id from Keycloak>   # Reuse the existing OAuth client. Its registered redirect URI
    client_secret_file: secrets/main/google_client_secret    # (.../auth/realms/main/broker/google/endpoint) works through urls.endpoints.callback.
    scopes: [openid, email, profile]    # parity
    trust_email: true                   # DIFFERS: Keycloak has false (see section 3).
    sync_mode: import                   # parity
  apple:
    enabled: false                      # Set true once the four fields below are filled in; an enabled provider without them fails config check.
                                        # Apple login works in production today. The app starts it through Keycloak (kc_idp_hint=apple), so production Keycloak has an Apple provider (the exported dev realm does not).
                                        # While Apple is off, config check warns about App Store Review Guideline 4.8; cut-over needs it on.
    # client_id (Services ID), team_id, key_id and private_key_file: copy them from the Keycloak Apple provider (see open item 1).
    # The Apple Services ID return URL is the Keycloak broker path, https://auth.example.com/auth/realms/main/broker/apple/endpoint,
    # which urls.endpoints.callback serves unchanged. The only change at Apple is the server-to-server notification
    # endpoint, https://auth.example.com/auth/main/events/apple, set at cut-over (section 11).

clients:
  app:
    name: example app
    type: public
    redirect_uris: [com.example.app:/cb, com.example.app.beta:/cb, com.example.app.dev:/cb]   # parity
    post_logout_redirect_uris: []       # empty = same as redirect_uris (Keycloak "+")
    require_pkce: false                 # The app sends no challenge. Becomes true after the app sets pkceMethod: 'S256'.
    response_mode: fragment             # The app's default.
    audience: account                   # Keycloak's value; the API does not check it.
    # Long-lived sign-in for the app (see DESIGN.md, Long-lived sessions). Uncomment only after the app sends PKCE
    # (section 8, item 2) and require_pkce is true: without PKCE, a code intercepted by another app that claims
    # the same custom scheme (RFC 8252 §8.1) would give a two-year session.
    # refresh_idle_lifetime: 17520h
    # session_max_lifetime: 0
